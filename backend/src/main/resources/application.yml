server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: uav-admin-backend
  profiles:
    active: dev
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 50MB

mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  type-aliases-package: com.uav.admin.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

uav:
  jwt:
    secret: "uav-admin-jwt-secret-key-please-change-in-production-2026"
    # access token 有效期（毫秒）30 分钟
    expire: 1800000
    # refresh token 有效期（毫秒）7 天
    refresh-expire: 604800000
    header: Authorization
    prefix: "Bearer "
  cert:
    # 合格证默认有效期（年）
    valid-years: 6
    issue-org: "无人机驾驶员管理机构"
  qualification:
    valid-years: 3
